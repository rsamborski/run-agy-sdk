name: '🧪 Unit Tests & Coverage'

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  test:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up Python'
        uses: 'actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0' # ratchet:actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: 'Install hash-locked test dependencies'
        shell: 'bash'
        run: |-
          set -euo pipefail
          python3 -m pip install --require-hashes --no-deps -r requirements-dev.txt

      - name: 'Run pytest with coverage enforcement (>80%)'
        shell: 'bash'
        run: |-
          set -euo pipefail
          python3 -m pytest --cov=run_agent --cov-report=term-missing --cov-fail-under=80
