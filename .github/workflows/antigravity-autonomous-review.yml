name: 'Antigravity Code Review Workflow'

on:
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Pull Request number to review (optional, auto-detected if omitted)'
        required: false
        type: string
      additional_context:
        description: 'Additional instructions or focus areas for the review'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # Job 1: Antigravity Code Review on PR creation or updates
  antigravity-code-review:
    name: 'PR Automated Review'
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/antigravity-review.yml
    with:
      pull_request_number: ${{ inputs.pull_request_number }}
      additional_context: ${{ inputs.additional_context || '' }}
    secrets: inherit

  # Job 2: Comment-triggered On-Demand PR Review Dispatcher
  dispatch-comment-review:
    name: 'Comment Dispatcher Review'
    # Only execute if the event is a comment on a pull request containing the trigger text
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      (contains(github.event.comment.body, '@agy /review'))
    uses: ./.github/workflows/antigravity-review.yml
    with:
      pull_request_number: ''
      additional_context: ''
    secrets: inherit
