name: '🔎 Antigravity Review'

on:
  workflow_call:
    inputs:
      pull_request_number:
        type: 'string'
        description: 'The Pull Request number to review'
        required: false
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref_name }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Determine Pull Request Number'
        id: 'determine_pr'
        shell: 'bash'
        run: |-
          PR_NUMBER="${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "Attempting to auto-detect Pull Request number for branch ${{ github.ref_name }}..."
            PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --json number --jq '.[0].number' || true)
            if [ -n "$PR_NUMBER" ]; then
              echo "Detected PR number: $PR_NUMBER"
            else
              echo "No open PR found for branch ${{ github.ref_name }}"
            fi
          fi
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'

      - name: 'Checkout repository'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # ratchet:actions/checkout@v6
        with:
          ref: ${{ steps.determine_pr.outputs.pr_number && format('refs/pull/{0}/merge', steps.determine_pr.outputs.pr_number) || github.ref }}
          persist-credentials: false

      - name: 'Run Antigravity PR Review'
        uses: './'
        id: 'agy_pr_review'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.pull_request.body || github.event.issue.body }}'
          PULL_REQUEST_NUMBER: '${{ steps.determine_pr.outputs.pr_number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
        with:
          api-key: '${{ secrets.ANTIGRAVITY_API_KEY || secrets.GEMINI_API_KEY }}'
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          trust-workspace: 'true'
          sandbox-profile: 'true'
          upload_artifacts: "${{ vars.UPLOAD_ARTIFACTS || 'false' }}"
          workflow_name: 'antigravity-review'
          github_pr_number: '${{ steps.determine_pr.outputs.pr_number }}'
          prompt: '/antigravity-review'
