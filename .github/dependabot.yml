version: 2
updates:
  # Maintain GitHub Actions used in the CI pipeline
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns: ["*"]
    assignees:
      - "rsamborski"

  # Maintain hash-pinned Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns: ["*"]
    assignees:
      - "rsamborski"
