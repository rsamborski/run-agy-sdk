name: 'Antigravity Review Action'
description: 'Execute the Google Antigravity SDK autonomous agent to review and improve code'
author: 'Remigiusz Samborski'
inputs:
  api-key:
    description: 'The Gemini API key used to authenticate language model interactions'
    required: true
  github-token:
    description: 'GitHub token for pull request interactions and automated code feedback'
    required: false
    default: '${{ github.token }}'
  mode:
    description: 'Operational mode of the agent. Allowed: "goal" (multi-turn problem solving), "one-shot" (one query), "review" (code audit)'
    required: false
    default: 'goal'
  goal-prompt:
    description: 'The description of the problem or requirements the agent is being instructed to resolve'
    required: false
  sandbox-profile:
    description: 'Enables kernel-level or process-level containment ("true" / "false" or specific profile name/path)'
    required: false
    default: 'true'
  trust-workspace:
    description: 'Explicitly trust the repository workspace directory ("true" / "false") to enable write/command tools'
    required: false
    default: 'false'
  workspace-dir:
    description: 'Path to the workspace directory the agent is allowed to inspect'
    required: false
    default: '.'
  stream-output:
    description: 'Whether to stream agent response tokens to stdout logs ("true" / "false"). Set "false" on sensitive private repositories.'
    required: false
    default: 'true'
  prompt:
    description: 'The prompt or slash command to execute.'
    required: false
  additional_context:
    description: 'Additional context for the agent.'
    required: false
  github_pr_number:
    description: 'The Pull Request number.'
    required: false
    default: '${{ github.event.pull_request.number }}'
  github_issue_number:
    description: 'The Issue number.'
    required: false
    default: '${{ github.event.issue.number }}'

outputs:
  response:
    description: 'The clean final response text returned by the Antigravity agent execution'
    value: '${{ steps.agy_run.outputs.response }}'
  stats:
    description: 'JSON object summarizing execution metrics, token expenditures, and overall latencies'
    value: '${{ steps.agy_run.outputs.stats }}'

runs:
  using: 'composite'
  steps:
    - name: 'Set up Python'
      uses: 'actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0' # ratchet:actions/setup-python@v7.1.0
      with:
        python-version: '3.11'

    - name: 'Install Antigravity SDK'
      shell: 'bash'
      run: |-
        set -euo pipefail
        python3 -m pip install --require-hashes --no-deps -r "${GITHUB_ACTION_PATH}/requirements.txt"

    - name: 'Prepare Isolated Credentials'
      id: 'prepare_creds'
      shell: 'bash'
      run: |-
        set -euo pipefail
        umask 077
        CREDS_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/agy-creds-XXXXXX")"
        CREDS_FILE="${CREDS_DIR}/secrets.json"
        python3 - "${CREDS_FILE}" <<'PY'
        import json, os, sys
        with open(sys.argv[1], "w", encoding="utf-8") as f:
            json.dump(
                {
                    "api_key": os.environ.get("AGY_INPUT_API_KEY", ""),
                    "github_token": os.environ.get("AGY_INPUT_GITHUB_TOKEN", ""),
                },
                f,
            )
        PY
        echo "creds_dir=${CREDS_DIR}" >> "${GITHUB_OUTPUT}"
        echo "creds_file=${CREDS_FILE}" >> "${GITHUB_OUTPUT}"
      env:
        AGY_INPUT_API_KEY: '${{ inputs.api-key }}'
        AGY_INPUT_GITHUB_TOKEN: '${{ inputs.github-token }}'

    - name: 'Run Antigravity SDK Agent'
      id: 'agy_run'
      shell: 'bash'
      run: |-
        set -euo pipefail

        # Determine prompt text
        PROMPT_TEXT="${AGY_INPUT_PROMPT}"
        if [ -z "${PROMPT_TEXT}" ]; then
          if [ "${AGY_MODE}" = "review" ]; then
            PROMPT_TEXT="/antigravity-review"
          else
            PROMPT_TEXT="${AGY_GOAL_PROMPT}"
          fi
        fi

        if [ -z "${PROMPT_TEXT}" ]; then
          echo "::error::Prompt or goal-prompt is required." >&2
          exit 1
        fi

        export AGY_PROMPT="${PROMPT_TEXT}"

        python3 "${GITHUB_ACTION_PATH}/run_agent.py"
      env:
        AGY_CREDENTIALS_FILE: '${{ steps.prepare_creds.outputs.creds_file }}'
        AGY_CREDENTIALS_DIR: '${{ steps.prepare_creds.outputs.creds_dir }}'
        AGY_WORKSPACE_DIR: '${{ inputs.workspace-dir }}'
        AGY_SANDBOX_PROFILE: '${{ inputs.sandbox-profile }}'
        AGY_TRUST_WORKSPACE: '${{ inputs.trust-workspace }}'
        AGY_STREAM_OUTPUT: '${{ inputs.stream-output }}'
        AGY_INPUT_PROMPT: '${{ inputs.prompt }}'
        AGY_MODE: '${{ inputs.mode }}'
        AGY_GOAL_PROMPT: '${{ inputs.goal-prompt }}'
        AGY_REPOSITORY: '${{ github.repository }}'
        AGY_PR_NUMBER: '${{ inputs.github_pr_number }}'
        AGY_ISSUE_NUMBER: '${{ inputs.github_issue_number }}'
        AGY_ADDITIONAL_CONTEXT: '${{ inputs.additional_context || inputs.goal-prompt }}'
        AGY_TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
        AGY_DESCRIPTION: '${{ github.event.pull_request.body || github.event.issue.body }}'
        AGY_EVENT_NAME: '${{ github.event_name }}'
        AGY_IS_PULL_REQUEST: '${{ !!github.event.pull_request }}'

    - name: 'Cleanup Isolated Credentials'
      if: always()
      shell: 'bash'
      run: |-
        if [ -n "${AGY_CREDENTIALS_DIR:-}" ] && [ -d "${AGY_CREDENTIALS_DIR}" ]; then
          rm -rf "${AGY_CREDENTIALS_DIR}"
        fi
      env:
        AGY_CREDENTIALS_DIR: '${{ steps.prepare_creds.outputs.creds_dir }}'
